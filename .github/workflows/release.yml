name: Build and release

# Runs when you push a version tag (git tag v1.0.0 && git push --tags),
# or by hand from the Actions tab (builds only, no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: CaseCovers-windows.exe
          - os: macos-latest
            asset: CaseCovers-macos.zip
          - os: ubuntu-latest
            asset: CaseCovers-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1
      - run: python -m pip install -r requirements-build.txt
      - name: Stamp the version into the build
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: echo "$TAG" > assets/version.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Selftest (source)
        run: python qt_gui.py --selftest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: pyinstaller --noconfirm steamcase.spec

      - name: Selftest (built app) - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\CaseCovers.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          Copy-Item dist\CaseCovers.exe ${{ matrix.asset }}
      - name: Installer (build and smoke test) - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          $ErrorActionPreference = 'Stop'
          # A tag build uses its version; a manual run gets a placeholder version.
          $version = if ($env:IS_TAG -eq 'true' -and $env:REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.0.0' }
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
                  Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$version" "/O$PWD\build\installer" tools\casecovers.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          $setup = "build\installer\CaseCovers-Setup-$version.exe"
          # Install, run the installed selftest and uninstall before anything is released.
          $smoke = Join-Path $env:RUNNER_TEMP 'casecovers-smoke'
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=`"$smoke`"") -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$smoke\CaseCovers.exe")) { throw 'Silent install failed.' }
          $p = Start-Process -FilePath "$smoke\CaseCovers.exe" -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installed selftest failed.' }
          $p = Start-Process -FilePath "$smoke\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path "$smoke\CaseCovers.exe")) { throw 'Silent uninstall failed.' }
          Copy-Item $setup CaseCovers-Setup-windows.exe
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CaseCovers-Setup-windows.exe
          path: CaseCovers-Setup-windows.exe
      - name: Selftest (built app) - macOS
        if: runner.os == 'macOS'
        run: |
          # Apple Silicon refuses unsigned programs, and a downloaded unsigned app is reported as "damaged".
          # An ad-hoc signature (free, no Apple account) turns that into the normal "unidentified developer" prompt.
          xattr -cr dist/CaseCovers.app
          codesign --force --deep --sign - dist/CaseCovers.app
          codesign --verify --deep --strict --verbose=2 dist/CaseCovers.app
          dist/CaseCovers.app/Contents/MacOS/CaseCovers --selftest
          ditto -c -k --keepParent dist/CaseCovers.app ${{ matrix.asset }}
      - name: Selftest (built app) - Linux
        if: runner.os == 'Linux'
        run: |
          QT_QPA_PLATFORM=offscreen dist/CaseCovers --selftest
          cp dist/CaseCovers ${{ matrix.asset }}
          chmod +x ${{ matrix.asset }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write        # lets GitHub sign the build certificates below
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Signed build provenance (who built each file, from which commit)
        # GitHub offers attestations only for public repositories on personal accounts.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: assets/*
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}   # v0.x = pre-release until v1.0.0
